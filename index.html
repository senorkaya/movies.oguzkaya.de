<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oguz' Filmliste</title>
  <meta name="description" content="Filme, die ich gesehen habe und euch empfehle. Ehrlich bewertet, ohne Spoiler.">
  <meta property="og:title" content="Oguz' Filmliste">
  <meta property="og:description" content="Jeder Film, den ich gucke, mit Bewertung und meiner Meinung dazu.">
  <meta property="og:image" content="https://movies.oguzkaya.de/backdrops/i-am-mother.jpg">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="top-link" href="watchlist.html">Watchlist</a>
    <div class="hero-inner">
      <h1 id="h1">Oguz' <span class="accent">Filmliste.</span></h1>
      <p class="lead" id="lead">Jeder Film, den ich gucke, mit Bewertung und meiner Meinung dazu.</p>
      <form id="signup-form" class="hero-signup" novalidate>
        <label class="visually-hidden" for="signup-email" id="signup-label">E-Mail-Adresse</label>
        <input type="email" id="signup-email" name="email" autocomplete="email" placeholder="deine@mail.de" required>
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="btn primary" id="signup-btn">Banger-Alarm aktivieren</button>
      </form>
      <p class="signup-msg" id="signup-msg" role="status">Mail bei jedem Film ab 4,2. Jederzeit abmeldbar.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="section" id="lieblinge">
      <h2 id="h-favorites">Meine aktuellen Filmempfehlungen</h2>
      <div class="row" id="favorites"></div>
    </section>

    <section class="section" id="zuletzt">
      <h2 id="h-recent">Zuletzt gesehen</h2>
      <div class="row" id="recent"></div>
    </section>

    <section class="section" id="alle">
      <h2 id="h-all">Alle Filme</h2>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="footer"><span id="footer">Bilder: TMDB</span> · <a href="impressum.html" id="imprint-link">Impressum</a></footer>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-bg" data-close></div>
    <article class="sheet" id="sheet" role="dialog" aria-modal="true"></article>
  </div>

  <script src="app.js"></script>
</body>
</html>
