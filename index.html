<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oguz' Filmliste</title>
  <meta name="description" content="Filme, die ich gesehen habe und euch empfehle. Ehrlich bewertet, ohne Spoiler.">
  <meta property="og:title" content="Oguz' Filmliste">
  <meta property="og:description" content="Jeder Film, den ich gucke, mit Bewertung und meiner Meinung dazu.">
  <meta property="og:image" content="https://movies.oguzkaya.de/backdrops/i-am-mother.jpg">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1>Oguz' <span class="accent">Filmliste.</span></h1>
      <p class="lead">Jeder Film, den ich gucke, mit Bewertung und meiner Meinung dazu.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="section" id="lieblinge">
      <h2>Meine Lieblingsfilme</h2>
      <div class="row" id="favorites"></div>
    </section>

    <section class="section" id="zuletzt">
      <h2>Zuletzt gesehen</h2>
      <div class="row" id="recent"></div>
    </section>

    <section class="section" id="alle">
      <h2>Alle Filme</h2>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="footer">Bilder: TMDB</footer>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-bg" data-close></div>
    <article class="sheet" id="sheet" role="dialog" aria-modal="true"></article>
  </div>

  <script src="app.js"></script>
</body>
</html>
