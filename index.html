<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--meta:start-->
  <title>Oguz' Filmempfehlungen</title>
  <meta name="description" content="Filme, die ich gesehen habe und euch ans Herz lege.">
  <meta property="og:title" content="Oguz' Filmempfehlungen">
  <meta property="og:description" content="Filme, die ich gesehen habe und euch ans Herz lege.">
  <meta property="og:image" content="https://movies.oguzkaya.de/backdrops/bugonia.jpg">
  <meta property="og:url" content="https://movies.oguzkaya.de/">
  <!--meta:end-->
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0c0b0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <nav class="topbar">
    <a href="/" class="brand">Oguz <em>schaut</em></a>
    <span class="stats" id="stats"></span>
  </nav>

  <header class="hero" id="hero"></header>

  <section class="section" id="top-section">
    <h2 class="section-title">Oguz' <em>Top 4</em></h2>
    <div class="top4" id="top4"></div>
  </section>

  <section class="section">
    <div class="toolbar">
      <h2 class="section-title">Alle <em>Empfehlungen</em></h2>
      <label class="sort">
        Sortieren
        <select id="sort">
          <option value="rating">Beste Bewertung</option>
          <option value="added">Neueste</option>
          <option value="title">A–Z</option>
        </select>
      </label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="footer">Mit Liebe kuratiert von Oguz · Poster &amp; Bilder: TMDB</footer>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-backdrop" data-close></div>
    <article class="sheet" id="sheet" role="dialog" aria-modal="true"></article>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
