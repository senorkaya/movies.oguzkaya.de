<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oguz' Filmempfehlungen</title>
  <meta name="description" content="Filme, die ich gesehen habe und euch empfehle.">
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --text: #f2f2f2;
      --muted: #9a9aa5;
      --accent: #f5c518;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header { max-width: 1000px; margin: 0 auto; padding: 48px 16px 24px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    header p { margin: 0; color: var(--muted); }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 16px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }
    .movie { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .movie img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; background: #000; }
    .body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; }
    .title { margin: 0; font-size: 1.1rem; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .rating { font-weight: 700; color: var(--accent); font-size: 1.05rem; }
    .rating span { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
    .review { margin: 4px 0 0; font-size: 0.95rem; }
    .review.empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>🎬 Oguz' Filmempfehlungen</h1>
    <p>Filme, die ich gesehen habe und euch ans Herz lege.</p>
  </header>
  <main id="movies"></main>

  <script>
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    fetch("movies.json")
      .then(r => r.json())
      .then(movies => {
        movies.sort((a, b) => b.rating - a.rating);
        document.getElementById("movies").innerHTML = movies.map(m => `
          <article class="movie">
            <img src="${esc(m.poster)}" alt="Poster: ${esc(m.title)}" loading="lazy">
            <div class="body">
              <h2 class="title">${esc(m.title)}</h2>
              <div class="meta">${esc(m.year)} · ${esc(m.director)}</div>
              <div class="rating">★ ${esc(m.rating)}<span>/10</span></div>
              <p class="review ${m.review ? "" : "empty"}">${m.review ? esc(m.review) : "Review folgt …"}</p>
            </div>
          </article>`).join("");
      });
  </script>
</body>
</html>
